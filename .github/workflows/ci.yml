name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install from lockfile
        run: uv sync --locked --extra dev --extra research --extra vector --extra rerank
      - name: Add virtualenv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy ragbench benchmarks scripts tests
      - name: Test
        run: pytest --cov=ragbench --cov-report=term-missing --cov-fail-under=60
      - name: Validate committed research fixture
        run: python -m ragbench.cli.main dataset validate datasets/processed/vi_wiki_retrieval
      - name: Offline benchmark smoke
        run: python benchmarks/run_all.py --techniques parent_child --docs datasets/sample/docs --qa datasets/sample/qa.jsonl --output /tmp/ragbench-bench --mode full_rag
      - name: Build wheel
        run: python -m build --wheel
      - name: Check wheel ships only the ragbench namespace
        run: python scripts/check_wheel_contents.py
      - name: Installed wheel smoke outside checkout
        run: |
          uv pip install --force-reinstall dist/*.whl
          cd /tmp
          ragbench techniques list
          ragbench ingest --technique parent_child --input "$GITHUB_WORKSPACE/datasets/sample/docs" --output /tmp/ragbench-artifact
          ragbench query --technique parent_child --artifact /tmp/ragbench-artifact --query "Điều kiện xét tuyển là gì?"
          ragbench eval --technique parent_child --artifact /tmp/ragbench-artifact --dataset "$GITHUB_WORKSPACE/datasets/sample/qa.jsonl" --output /tmp/ragbench-eval.json
