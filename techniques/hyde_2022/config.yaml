{
  "name": "hyde_2022",
  "processing": {
    "parser": {"type": "markdown"},
    "cleaners": [
      {"type": "vietnamese_normalizer"},
      {"type": "whitespace_cleaner"}
    ],
    "chunker": {"type": "recursive", "params": {"chunk_size": 220, "overlap": 30}},
    "enrichers": [{"type": "section_title"}]
  },
  "indexing": {
    "embedding": {
      "type": "openai",
      "params": {
        "model": "${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}",
        "batch_size": 64
      }
    }
  },
  "inference": {
    "retriever": {
      "type": "hyde",
      "params": {
        "top_k": 5,
        "embedding_model": "${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}",
        "generator_model": "${OPENAI_CHAT_MODEL:-gpt-4.1-mini}",
        "samples": 5,
        "temperature": 0.7,
        "max_tokens": 350
      }
    },
    "reranker": {"type": "none", "params": {"top_k": 5}},
    "context_builder": {"type": "citation_context", "params": {"max_tokens": 2200}},
    "generator": {
      "type": "openai_chat",
      "params": {
        "model": "${OPENAI_CHAT_MODEL:-gpt-4.1-mini}",
        "temperature": 0,
        "max_tokens": 700
      }
    },
    "verifier": {"type": "citation_coverage"}
  },
  "evaluation": {
    "metrics": ["recall_at_5", "mrr", "citation_accuracy", "latency", "token_usage", "estimated_cost"]
  }
}
