{
  "name": "technique_id",
  "processing": {
    "parser": {"type": "markdown"},
    "cleaners": [
      {"type": "vietnamese_normalizer"},
      {"type": "whitespace_cleaner"}
    ],
    "chunker": {"type": "recursive", "params": {"chunk_size": 220, "overlap": 30}},
    "enrichers": [{"type": "section_title"}]
  },
  "inference": {
    "retriever": {"type": "bm25", "params": {"top_k": 5}},
    "reranker": {"type": "none", "params": {"top_k": 5}},
    "context_builder": {"type": "citation_context", "params": {"max_tokens": 1200}},
    "generator": {"type": "citation_required"},
    "verifier": {"type": "citation_coverage"}
  },
  "evaluation": {
    "metrics": ["recall_at_5", "mrr", "citation_accuracy", "latency"]
  }
}
