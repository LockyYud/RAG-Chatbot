[project]
name = "rag-pipeline-lab"
version = "0.2.0"
description = "A full-stack lab for benchmarking RAG pipeline strategies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.86.0",
    # Artifact v4 stores embeddings in a sibling .npy file (raglab/indexing/artifacts.py)
    # rather than inline in nodes.json — needed by any dense technique's ingest/load,
    # not just the optional FAISS backend, so it is a base dependency now.
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "setuptools>=68",
]
research = [
  "datasets>=2.20",
  "pandas>=2.2",
  "pyarrow>=16",
  "pydantic>=2.7",
  "pyyaml>=6",
]
vector = [
  "faiss-cpu>=1.8",
]
rerank = [
  "sentence-transformers>=3.0",
]

[project.scripts]
raglab = "raglab.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["raglab*", "evaluation*", "techniques*"]
exclude = ["datasets*", "benchmarks*", "tests*"]

[tool.setuptools.package-data]
"*" = ["technique.yaml", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/run_all.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
exclude = ["artifacts", "benchmarks/results"]
