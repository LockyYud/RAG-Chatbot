{
  "id": "contextual_retrieval_2024",
  "name": "Contextual Retrieval (Anthropic, 2024)",
  "base": "bm25_hybrid_rerank",
  "paper": {
    "title": "Introducing Contextual Retrieval",
    "authors": ["Anthropic"],
    "year": 2024,
    "url": "https://www.anthropic.com/news/contextual-retrieval"
  },
  "implementation": {
    "level": "paper_inspired",
    "status": "runnable",
    "reproduced": [
      "LLM-written 1-2 sentence context snippet prepended to each chunk's indexing text before both dense embedding and BM25 indexing"
    ],
    "omitted": [
      "Anthropic's prompt-caching serving-cost optimization — this repo reproduces the retrieval-quality technique, not the cost-reduction infrastructure around it"
    ],
    "deviations": [
      "a failed context-generation call degrades to the plain (uncontextualized) chunk instead of aborting ingest"
    ]
  },
  "stage": ["enrichment", "indexing", "retrieval", "reranking"],
  "capabilities": {"evaluation_profiles": ["retrieval", "single_hop_rag", "citation_rag"], "custom_artifacts": false},
  "requires": ["openai_embeddings", "openai_chat"],
  "best_for": ["long_documents", "context_losing_chunks", "disambiguation_queries"],
  "weak_for": ["tight_ingest_budget", "self_contained_chunks"],
  "config": null,
  "custom_register": null
}
