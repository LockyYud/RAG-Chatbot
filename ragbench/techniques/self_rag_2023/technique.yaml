{
  "id": "self_rag_2023",
  "name": "Self-RAG-Inspired Critique Verifier",
  "base": "parent_child",
  "paper": {
    "title": "Self-RAG: Learning to Retrieve, Generate, and Critique through Self-Reflection",
    "authors": ["Akari Asai", "Zeqiu Wu", "Yizhong Wang", "Avirup Sil", "Hannaneh Hajishirzi"],
    "year": 2023,
    "url": "https://arxiv.org/abs/2310.11511"
  },
  "implementation": {
    "level": "concept_only",
    "status": "runnable_with_openai_compatible_api",
    "notes": "Implements only a post-generation critique inspired by Self-RAG support checking. It does not train reflection tokens or reproduce adaptive retrieval/beam search.",
    "reproduced": [
      "post-generation critique: a separate LLM call judges whether every claim in the answer is supported by the retrieved context, returning a structured {grounded, citation_coverage, unsupported_citations, notes} verdict"
    ],
    "omitted": [
      "reflection-token training/decoding",
      "the model's own adaptive decision of when to retrieve",
      "beam search over candidate generations reranked by critique score"
    ],
    "deviations": [
      "verification runs as a separate post-hoc LLM call rather than as tokens emitted by the generator itself during decoding"
    ]
  },
  "stage": ["generation", "verification"],
  "capabilities": {"evaluation_profiles": ["retrieval", "single_hop_rag", "citation_rag"], "custom_artifacts": false},
  "requires": ["openai_chat"],
  "best_for": ["citation_sensitive_qa", "factuality_checks", "production_review_gates"],
  "weak_for": ["strict_latency_constraints", "deterministic_audits", "table_heavy_documents"],
  "config": null,
  "custom_register": null
}
