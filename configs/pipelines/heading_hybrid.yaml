{
  "name": "heading_hybrid",
  "processing": {
    "parser": {"type": "markdown"},
    "cleaners": [
      {"type": "vietnamese_normalizer"},
      {"type": "whitespace_cleaner"}
    ],
    "chunker": {"type": "heading_aware", "params": {"chunk_size": 180, "overlap": 25}},
    "enrichers": [{"type": "section_title"}]
  },
  "inference": {
    "retriever": {"type": "hybrid", "params": {"top_k": 6, "alpha": 0.45}},
    "reranker": {"type": "lexical_overlap", "params": {"top_k": 4, "weight": 0.3}},
    "context_builder": {"type": "citation_context", "params": {"max_tokens": 1000}},
    "generator": {"type": "citation_required"},
    "verifier": {"type": "citation_coverage"}
  },
  "evaluation": {
    "metrics": ["recall_at_5", "mrr", "citation_accuracy", "latency"]
  }
}
