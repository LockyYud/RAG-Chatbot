{
  "name": "naive_dense",
  "processing": {
    "parser": {"type": "text"},
    "cleaners": [
      {"type": "vietnamese_normalizer"},
      {"type": "whitespace_cleaner"}
    ],
    "chunker": {"type": "fixed_size", "params": {"chunk_size": 120, "overlap": 20}},
    "enrichers": [{"type": "none"}]
  },
  "inference": {
    "retriever": {"type": "dense", "params": {"top_k": 5}},
    "reranker": {"type": "none", "params": {"top_k": 3}},
    "context_builder": {"type": "citation_context", "params": {"max_tokens": 800}},
    "generator": {"type": "citation_required"},
    "verifier": {"type": "citation_coverage"}
  },
  "evaluation": {
    "metrics": ["recall_at_5", "mrr", "citation_accuracy", "latency"]
  }
}
